<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Partner — Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/style.css">
<link rel="stylesheet" href="styles/login.css?v=3">
<link rel="preconnect" href="https://challenges.cloudflare.com">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="js/config.js"></script>
</head>
<body>

<div id="screen-login">

  <!-- Panel de imagen. Vacio a proposito: la foto va por background-image en
       login.css, dentro de un @media de escritorio, para que el celular no
       descargue 138 KB que nunca va a ver. El logo de GoHarv y los iconos de
       features ya vienen dentro de la imagen. -->
  <!-- La foto va por background-image en login.css (dentro de un @media de
       escritorio, para que el celular no la descargue). Lo unico que vive
       ACA es la marca, superpuesta arriba a la izquierda. -->
  <div class="login-izq">
    <div class="login-marca">
      <img src="img/logo-goharv.png" alt="GoHarv" class="login-marca-logo">
      <div class="login-marca-bp">
        <strong>Business Partner</strong>
        <span>by GoHarv.</span>
      </div>
    </div>
  </div>
  <div class="login-der">
    <div class="login-card">

      <div class="login-titulo">
        <h1>Gestión de<br><em>documentación</em> empresarial</h1>
        <span class="login-titulo-linea"></span>
      </div>

      <h2>Iniciar sesión</h2>
      <p class="sub">Ingresá con tu cuenta del sistema</p>

      <div class="login-error" id="login-error"></div>

      <div class="form-group">
        <label for="inp-email">Email</label>
        <input type="email" id="inp-email" placeholder="tu@email.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="inp-password">Contraseña</label>
        <div style="position:relative">
          <input type="password" id="inp-password" placeholder="••••••••" autocomplete="current-password" style="padding-right:44px">
          <button
            type="button"
            onclick="togglePassword()"
            style="position:absolute;right:0;top:0;height:100%;width:44px;background:transparent;border:none;cursor:pointer;color:var(--gris4);display:flex;align-items:center;justify-content:center;border-radius:0 8px 8px 0;transition:color .2s"
            onmouseover="this.style.color='var(--blanco)'"
            onmouseout="this.style.color='var(--gris4)'"
          >
            <svg id="icon-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="icon-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <p style="text-align:center;margin-top:16px">
          <a href="recuperar.html" style="color:var(--gris4);font-size:13px;text-decoration:none">
            ¿Olvidaste tu contraseña?
          </a>
        </p>
      </div>

      <button class="btn-login" id="btn-login" onclick="hacerLogin()">
        <div class="spinner" id="login-spinner"></div>
        <span id="login-btn-text">Ingresar</span>
      </button>
      <div class="form-group">
        <div class="cf-turnstile"
             data-sitekey="0x4AAAAAAD_Hd3rrFQFfudGj"
             data-callback="onTurnstileOk"
             data-expired-callback="onTurnstileExpired"
             data-error-callback="onTurnstileError"
             data-theme="dark"
             data-language="es"></div>
      </div>

    </div>
  </div>

  <footer class="login-footer">
    <span>Copyright © 2026 GoHarv Technology. All rights reserved.</span>
    <span class="login-footer-sep"></span>
    <span>Senillosa 233, 1° piso, Caballito (C1424), CABA, Argentina.</span>
    <span class="login-footer-sep"></span>
    <a href="https://www.goharv.com.ar" target="_blank" rel="noopener">www.goharv.com.ar</a>

    <!-- REDES: sin href todavia, faltan las URLs reales.
         Para completarlos, agregarle a cada <a>:
             href="https://..." target="_blank" rel="noopener"
         Sin href el <a> no navega, no aparece en la barra de estado del
         navegador y no entra en el orden de tabulacion — que es lo correcto
         para un boton que no tiene destino. El cursor de mano aparece solo
         cuando el href exista (ver .login-red[href] en login.css). -->
    <span class="login-redes">
      <a class="login-red" href="https://www.facebook.com/goharv.com.ar" aria-label="Facebook" target="_blank">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
      </a>
      <a class="login-red" aria-label="Instagram" href="https://www.instagram.com/goharv.com.ar" target="_blank">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
      </a>
      <a class="login-red" aria-label="LinkedIn" href="https://www.linkedin.com/company/goharv-%C2%AE-academy-business-compliance-consulting-technology/" target="_blank">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
      </a>
    </span>
  </footer>
</div>

<script>
// --- Turnstile -----------------------------------------------------------
// El token dura 300s, es de un solo uso, y un token repetido se rechaza
// con 'timeout-or-duplicate'. Por eso hay que resetear el widget en CADA
// error, no solo cuando el captcha falla.
let tsToken = null;

function onTurnstileOk(token)  { tsToken = token; mostrarError(''); }
function onTurnstileExpired()  { tsToken = null; }
function onTurnstileError()    { tsToken = null; }

function resetTurnstile() {
  tsToken = null;
  if (window.turnstile) { try { turnstile.reset(); } catch (_) {} }
}

function destinoPorRol(rol) {
  if (rol === 'franquiciante') return '/manuales-mi-empresa.php';
  if (rol === 'super_admin')   return '/dashboard.php';
  return '/mis-manuales.php'; // franquiciado, empleado
}

async function hacerLogin() {
  const email    = document.getElementById('inp-email').value.trim();
  const password = document.getElementById('inp-password').value;
  const btn      = document.getElementById('btn-login');
  const spinner  = document.getElementById('login-spinner');
  const btnText  = document.getElementById('login-btn-text');

  mostrarError('');

  if (!email || !password) { mostrarError('Completá los dos campos.'); return; }
  if (!tsToken) { mostrarError('Completá la verificación de seguridad.'); return; }

  btn.disabled          = true;
  spinner.style.display = 'block';
  btnText.textContent   = 'Ingresando...';

  try {
    const res = await fetch(API + '/login', {
      method:      'POST',
      headers:     { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      credentials: 'include',
      body:        JSON.stringify({ email, password, turnstile_token: tsToken }),
    });

    const data = await res.json();

    if (!res.ok) {
      resetTurnstile();
      mostrarError(data?.errors?.email?.[0] || data?.message || 'Credenciales incorrectas.');
      return;
    }

    localStorage.setItem('cl_rol', data.rol);
    window.location.href = BASE_URL + destinoPorRol(data.rol);

  } catch (err) {
    resetTurnstile();
    mostrarError('Error de conexión. Verificá que el servidor esté activo.');
  } finally {
    btn.disabled          = false;
    spinner.style.display = 'none';
    btnText.textContent   = 'Ingresar';
  }
}

function mostrarError(msg) {
  const el = document.getElementById('login-error');
  el.textContent   = msg;
  el.style.display = msg ? 'block' : 'none';
}

function togglePassword() {
  const input  = document.getElementById('inp-password');
  const eyeOn  = document.getElementById('icon-eye');
  const eyeOff = document.getElementById('icon-eye-off');
  const visible = input.type === 'text';
  input.type           = visible ? 'password' : 'text';
  eyeOn.style.display  = visible ? 'block' : 'none';
  eyeOff.style.display = visible ? 'none'  : 'block';
}

document.getElementById('inp-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') hacerLogin();
});

// Auto-login
(async () => {
  if (!localStorage.getItem('cl_rol')) return;
  try {
    const res = await fetch(API + '/me', {
      headers:     { 'Accept': 'application/json' },
      credentials: 'include',
    });
    if (res.ok) {
      const me = await res.json();
      window.location.href = BASE_URL + destinoPorRol(me.rol);
    } else {
      localStorage.removeItem('cl_rol');
    }
  } catch (_) {
    localStorage.removeItem('cl_rol');
  }
})();
</script>

</body>
</html>
